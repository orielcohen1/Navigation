name: indoor_nav
description: Indoor navigation using QR codes, floor maps, and AR compass overlay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Backend (Postgres + auto-generated REST API)
  supabase_flutter: ^2.8.0

  # QR code scanning
  mobile_scanner: ^5.1.1

  # Camera feed for AR screen
  camera: ^0.11.0

  # Device compass heading (for AR arrow direction)
  flutter_compass: ^0.8.0

  # Accelerometer / gyroscope (future use for tilt correction)
  sensors_plus: ^5.0.1

  # Priority queue for A* pathfinding
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Fallback demo venue used until a Supabase project is configured
    # (see SupabaseConfig.isConfigured / DataService).
    - assets/data/mall_data.json
